    <rect x="28" y="34" width="130" height="152" rx="16" fill="#3b465c"/>
    <rect x="180" y="45" width="145" height="16" rx="8" fill="#ffffff"/>
    <rect x="180" y="82" width="105" height="12" rx="6" fill="#aeb8cc"/>
