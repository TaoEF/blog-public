    <circle cx="75" cy="69" r="18" fill="#111111"/>
    <rect x="115" y="56" width="170" height="16" rx="8" fill="#111111"/>
    <rect x="30" y="130" width="180" height="18" rx="9" fill="#aeb8cc"/>
    <rect x="30" y="166" width="330" height="12" rx="6" fill="#6d7a96"/>
