<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="Logo refinement checklist">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="90" y="118" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#121826">Logo refinement checklist</text>
  <text x="90" y="164" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#607089">Use this before replacing a recognizable logo with a totally new one.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#121826">
    <rect x="90" y="235" width="1220" height="86" rx="22" fill="#ffffff" stroke="#dce3ef"/>
    <circle cx="140" cy="278" r="17" fill="#29a366"/>
    <path d="M132 278 l7 8 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="288">Does the logo stay readable as a small app icon?</text>

    <rect x="90" y="345" width="1220" height="86" rx="22" fill="#ffffff" stroke="#dce3ef"/>
    <circle cx="140" cy="388" r="17" fill="#29a366"/>
    <path d="M132 388 l7 8 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="398">Can the wordmark and symbol work separately?</text>

    <rect x="90" y="455" width="1220" height="86" rx="22" fill="#ffffff" stroke="#dce3ef"/>
    <circle cx="140" cy="498" r="17" fill="#29a366"/>
    <path d="M132 498 l7 8 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="508">Are decorative details helping recognition or adding noise?</text>

    <rect x="90" y="565" width="1220" height="86" rx="22" fill="#ffffff" stroke="#dce3ef"/>
    <circle cx="140" cy="608" r="17" fill="#29a366"/>
    <path d="M132 608 l7 8 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="618">Does it work on both light and dark backgrounds?</text>
  </g>
  <text x="90" y="735" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#607089">Editorial graphic created for Sologo article layout testing.</text>
</svg>
